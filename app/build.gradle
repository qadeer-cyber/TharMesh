apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
// A blank local.properties entry must not hide a CI environment variable.
def firstNonBlank = { String name ->
    def candidates = [
            localProps.getProperty(name),
            System.getenv(name),
            project.findProperty(name)
    ]
    for (candidate in candidates) {
        if (candidate != null && candidate.toString().trim()) {
            return candidate.toString().trim()
        }
    }
    return ""
}
def googleWebClientId = firstNonBlank("GOOGLE_WEB_CLIENT_ID")

// Supabase project URL and the public publishable key. Both stay empty in git.
// A blank value makes AuthBackend fail closed. Never put a service-role key here.
def supabaseUrl = firstNonBlank("SUPABASE_URL")
def supabaseAnonKey = firstNonBlank("SUPABASE_ANON_KEY")
def escapeBuildConfig = { String value ->
    value.replace("\\", "\\\\").replace("\"", "\\\"")
}

// Stage 10.1 — short commit hash exposed via BuildConfig.GIT_COMMIT_HASH and
// rendered on the About screen. Defensive: silently falls back to "—" when
// git is unavailable (CI environments without a .git checkout, source-only
// builds) so the build never breaks. No new dependencies — uses the JDK's
// process executor.
def gitCommitHash = "—"
try {
    def proc = "git rev-parse --short HEAD".execute(null, rootProject.projectDir)
    proc.waitFor()
    if (proc.exitValue() == 0) {
        def out = proc.text.trim()
        if (!out.isEmpty()) {
            gitCommitHash = out
        }
    }
} catch (Exception ignored) {
    // Keep fallback.
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "tharmesh.app"
        minSdkVersion 24
        targetSdkVersion 30
        versionCode 1
        versionName "0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${escapeBuildConfig(googleWebClientId)}\""
        buildConfigField "String", "GIT_COMMIT_HASH", "\"${gitCommitHash}\""
        buildConfigField "String", "SUPABASE_URL", "\"${escapeBuildConfig(supabaseUrl)}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${escapeBuildConfig(supabaseAnonKey)}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.6.21"
    implementation "androidx.core:core-ktx:1.6.0"
    implementation "androidx.appcompat:appcompat:1.3.1"
    implementation "com.google.android.material:material:1.4.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.0"
    implementation "androidx.activity:activity-ktx:1.3.1"
    implementation "androidx.fragment:fragment-ktx:1.3.6"

    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.3.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"

    implementation "androidx.room:room-runtime:2.3.0"
    implementation "androidx.room:room-ktx:2.3.0"
    kapt "androidx.room:room-compiler:2.3.0"

    implementation "com.google.android.gms:play-services-auth:20.7.0"
    implementation "com.google.android.gms:play-services-nearby:18.5.0"

    // QR rendering + camera-based scanner. ~700 KB. Bundles zxing core 3.4.x.
    // Compatible with minSdk 24 / AGP 4.1.3 / appcompat 1.3.1; pinned to the
    // last 4.x release that still publishes against AndroidX 1.3.x.
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.5.2"
    testImplementation "org.mockito:mockito-core:4.11.0"
    // Real org.json for unit tests; Android's stub otherwise returns null for everything.
    testImplementation "org.json:json:20210307"
    testImplementation "org.xerial:sqlite-jdbc:3.42.0.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"
}
