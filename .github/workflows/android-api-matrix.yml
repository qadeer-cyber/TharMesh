name: Android API 33–35 evidence

on:
  workflow_dispatch:
  # Push-only, same rationale as emulator-evidence.yml (b3d1b37): the push and
  # pull_request triggers have different concurrency keys, so every commit used to
  # start two runs of three emulators each. The push run still reports as a check
  # on the stacked PR.
  push:
    branches:
      - cursor/tharmesh-0.9-engineering-5aa9
    paths:
      - "app/**"
      - "scripts/api-emulator-evidence.sh"
      - "scripts/verify-pinned-apk.sh"
      - "scripts/pinned/**"
      - ".github/workflows/android-api-matrix.yml"

permissions:
  contents: read

concurrency:
  group: android-api-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
  ANDROID_COMPILE_SDK: "30"
  ANDROID_BUILD_TOOLS: "30.0.3"

jobs:
  prepare-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - run: ./gradlew --no-daemon assembleDebug
      - name: Package head APK with digest manifest
        run: |
          set -euo pipefail
          mkdir -p apk-artifacts
          cp -f app/build/outputs/apk/debug/tharmesh.app-debug.apk apk-artifacts/tharmesh-head-debug.apk
          sha256sum apk-artifacts/tharmesh-head-debug.apk | sed 's#apk-artifacts/##' \
            | tee apk-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: api-matrix-apk
          path: apk-artifacts/

  api-emulator-evidence:
    needs: prepare-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - api-level: 33
            target: google_apis
          - api-level: 34
            target: google_apis
          - api-level: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api-matrix-apk
          path: apk-artifacts
      - name: Enable KVM
        run: |
          echo 'SUBSYSTEM=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo chmod 666 /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS }}
      - name: API ${{ matrix.api-level }} install + permission evidence
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2.33.0
        env:
          ANDROID_API_LEVEL: ${{ matrix.api-level }}
          THARMESH_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence/api-${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/api-emulator-evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-${{ matrix.api-level }}-evidence
          path: ci-evidence/api-${{ matrix.api-level }}/
