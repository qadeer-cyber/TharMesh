name: Android CI

# Verifies the High Sierra / iMac Mid 2010 toolchain on every PR and push to
# main: JDK 11 (Gradle 6.5 / AGP 4.1.3 will not run on 17+), Android SDK
# platforms;android-30 + build-tools;30.0.3. Runs assembleDebug and the
# JVM unit test suite; does NOT run instrumented tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      ANDROID_COMPILE_SDK: "30"
      ANDROID_BUILD_TOOLS: "30.0.3"
      # The GitHub-hosted runner's default sdkmanager (and the one pinned by
      # android-actions/setup-android@v3) is built against JDK 17. Gradle 6.5
      # / AGP 4.1.3 can only run on JDK 11, and setup-java@v4 above forces
      # JDK 11 into JAVA_HOME for the whole job. This env var tells
      # sdkmanager to skip its JDK 17 self-check so we can install SDK
      # packages with JDK 11 on PATH. Gradle itself is unaffected — it only
      # ever sees the compiled platform + build-tools, never sdkmanager.
      SKIP_JDK_VERSION_CHECK: "yes"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tharmesh-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
